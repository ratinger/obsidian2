<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大塚 ホテル・本屋・食事マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header {
      padding: 10px 14px 8px;
      background: #1a1a1a;
      color: #fff;
      flex: 0 0 auto;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; }
    #map { flex: 1 1 auto; min-height: 0; }
    .legend {
      position: absolute; z-index: 1000; right: 12px; bottom: 12px;
      background: rgba(255,255,255,0.95); border-radius: 8px;
      padding: 10px 12px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
      line-height: 1.6;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .pin-label {
      background: transparent; border: none; box-shadow: none;
      font-size: 11px; font-weight: 700; color: #111;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 1px 1px 0 #fff;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <h1>大塚駅周辺マップ（ホテル・本屋・食事）</h1>
      <p>北口＝ロイヤルホスト／山下書店　・　南口＝アトレヴィ／ホテル　｜　2026-08-11 旅行用</p>
    </header>
    <div id="map"></div>
  </div>
  <div class="legend">
    <div><span class="dot" style="background:#8e24aa"></span>ホテル</div>
    <div><span class="dot" style="background:#fb8c00"></span>食事</div>
    <div><span class="dot" style="background:#1e88e5"></span>本屋</div>
    <div><span class="dot" style="background:#6d4c41"></span>駅</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const places = [
      { name: "大塚駅（JR）", cat: "駅", lat: 35.731833, lng: 139.728060 },
      { name: "都電 大塚駅前", cat: "駅", lat: 35.731550, lng: 139.728350 },
      { name: "ホテル ベルクラシック", cat: "ホテル", lat: 35.731250, lng: 139.728700 },
      { name: "アトレヴィ大塚", cat: "食事", lat: 35.731500, lng: 139.728200 },
      { name: "旭屋書店（アトレヴィ4F）", cat: "本屋", lat: 35.731420, lng: 139.728280 },
      { name: "ロイヤルホスト（北口）", cat: "食事", lat: 35.732450, lng: 139.727950 },
      { name: "山下書店（北口・24h）", cat: "本屋", lat: 35.732380, lng: 139.727880 },
      { name: "新大塚駅（丸ノ内）", cat: "駅", lat: 35.725640, lng: 139.728620 },
    ];

    const colors = { "ホテル": "#8e24aa", "食事": "#fb8c00", "本屋": "#1e88e5", "駅": "#6d4c41" };

    const map = L.map("map", { zoomControl: true, attributionControl: true })
      .setView([35.7316, 139.7282], 17);

    L.tileLayer("https://{s}.tile.openstreetmap.jp/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors / OSM Japan"
    }).addTo(map);

    function circleIcon(color) {
      return L.divIcon({
        className: "",
        html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8],
      });
    }

    const bounds = [];
    places.forEach((p) => {
      const c = colors[p.cat] || "#333";
      L.marker([p.lat, p.lng], { icon: circleIcon(c) })
        .addTo(map)
        .bindPopup(`<b>${p.name}</b><br>${p.cat}`);
      L.marker([p.lat, p.lng], {
        icon: L.divIcon({
          className: "pin-label",
          html: p.name,
          iconSize: [160, 18],
          iconAnchor: [-10, 9],
        }),
        interactive: false,
      }).addTo(map);
      bounds.push([p.lat, p.lng]);
    });
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 17 });

    L.marker([35.73270, 139.72720], {
      icon: L.divIcon({
        className: "pin-label",
        html: "【北口エリア】",
        iconSize: [100, 18],
        iconAnchor: [50, 9],
      }),
      interactive: false,
    }).addTo(map);
    L.marker([35.73095, 139.72890], {
      icon: L.divIcon({
        className: "pin-label",
        html: "【南口エリア】",
        iconSize: [100, 18],
        iconAnchor: [50, 9],
      }),
      interactive: false,
    }).addTo(map);
  </script>
</body>
</html>
